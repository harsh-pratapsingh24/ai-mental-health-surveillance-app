<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating... | AegisMind</title>
  <link rel="stylesheet" href="/static/css/mobile.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #08080C;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(168, 85, 247, 0.2);
      border-top-color: #A855F7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 14px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Securing your session...</h2>
  <p>Connecting with AegisMind. Please wait a moment.</p>

  <script>
    window.SUPABASE_URL = {{ (supabase_url or '')|tojson }};
    window.SUPABASE_ANON_KEY = {{ (supabase_anon_key or '')|tojson }};

    async function handleAuthCallback() {
      if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || typeof window.supabase === 'undefined') {
        window.location.href = '/?status=authenticated';
        return;
      }

      try {
        const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const { data: { session }, error } = await client.auth.getSession();
        
        if (error) throw error;
        
        if (session && session.user) {
          localStorage.setItem('supabase_token', session.access_token);
          localStorage.setItem('supabase_user_id', session.user.id);
          localStorage.setItem('aegis_consent', 'true');
          
          const alias = session.user.user_metadata?.alias || session.user.email?.split('@')[0] || 'Member';
          localStorage.setItem('aegis_alias', alias);

          // Synchronize session with Flask backend
          await fetch('/api/auth/session', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
              access_token: session.access_token,
              user_id: session.user.id,
              email: session.user.email,
              alias: alias
            })
          }).catch(console.warn);

          window.location.replace('/');
        } else {
          // If no session found in URL hash/code, redirect to login
          setTimeout(() => {
            window.location.replace('/login');
          }, 1500);
        }
      } catch (err) {
        console.error('Auth callback error:', err);
        window.location.replace('/login?error=' + encodeURIComponent(err.message || 'Authentication failed'));
      }
    }

    handleAuthCallback();
  </script>
</body>
</html>
